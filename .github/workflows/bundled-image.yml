      - name: Move PagesCMS image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p media
          touch media/.gitkeep
          shopt -s nullglob
          FILES=(media/*)

          echo "========================================"
          echo "Repository state"
          echo "========================================"

          echo
          echo "MEDIA:"
          find media -maxdepth 1 -type f | sort || true

          echo
          echo "INDEX FILES:"
          find content -name index.md | sort || true

          echo
          echo "========================================"

          MOVED=0

          # Barrido completo: revisa TODAS las imágenes en media/
          for IMAGE in "${FILES[@]}"; do
              B=$(basename "$IMAGE")
              [ "$B" = ".gitkeep" ] && continue

              IMAGE_NAME="$B"

              echo
              echo "----------------------------------------"
              echo "Processing: $IMAGE_NAME"

              echo "Searching bundle..."

              grep -rlF --include=index.md "$IMAGE_NAME" content/ || true

              TARGET=$(grep -rlF --include=index.md "$IMAGE_NAME" content/ | head -n1 || true)

              if [ -n "$TARGET" ]; then
                  echo "Bundle found:"
                  echo "$TARGET"

                  DEST=$(dirname "$TARGET")
                  TARGET_PATH="$DEST/$IMAGE_NAME"

                  if [ -e "$TARGET_PATH" ]; then
                      FILENAME="${IMAGE_NAME%.*}"
                      EXTENSION="${IMAGE_NAME##*.}"

                      if [ "$FILENAME" = "$IMAGE_NAME" ]; then
                          EXTENSION=""
                      fi

                      COUNTER=1

                      while true; do
                          if [ -n "$EXTENSION" ]; then
                              NEW_IMAGE_NAME="${FILENAME}-${COUNTER}.${EXTENSION}"
                          else
                              NEW_IMAGE_NAME="${FILENAME}-${COUNTER}"
                          fi

                          if [ ! -e "$DEST/$NEW_IMAGE_NAME" ]; then
                              TARGET_PATH="$DEST/$NEW_IMAGE_NAME"
                              break
                          fi

                          COUNTER=$((COUNTER + 1))
                      done
                  fi

                  mv "$IMAGE" "$TARGET_PATH"

                  echo "Moved:"
                  echo "  $IMAGE"
                  echo "  ->"
                  echo "  $TARGET_PATH"

                  MOVED=1

              else
                  echo "No bundle references $IMAGE_NAME"
              fi
          done

          touch media/.gitkeep

          if [ "$MOVED" -eq 0 ]; then
              echo
              echo "No images were moved."
              exit 0
          fi      - name: Move PagesCMS image
