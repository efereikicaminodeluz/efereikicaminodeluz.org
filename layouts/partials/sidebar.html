                <span class="fa fa-youtube-square fa-2x btn-sombra"></span>
              </i>
            </div>

            <!-- FACEBOOK: Visible solo en LG (Desktop) -->
            <!-- Agregamos d-none d-lg-block al DIV padre para que los <br> no dejen hueco -->

              <i class="open-follow" data-modal="facebooklike" title="Síguenos/Like" style="cursor:pointer;">

        <!-- Modal YouTube -->
        <div id="youtube" class="follow-modal">
          <!-- El contenedor principal ahora es AZUL -->
          <div class="follow-modal-content" style="background-color: #6699CC !important; border: none;">

            <div class="follow-modal-header" style="display: flex; align-items: center; padding: 0 15px;">
              <h2 class="text-center" style="margin:0; color:white; flex-grow: 1; padding: 15px 0; padding-left: 30px;">
                AQUÍ⇩SUSCRÍBETE
              </h2>
              <i onclick="document.getElementById('youtube').style.display='none';
                  document.getElementById('iframeYouTube').src=document.getElementById('iframeYouTube').src"
                class="follow-modal-close">
                &times;
              </i>
            </div>

            <!-- Cuerpo del modal también en AZUL -->
            <div class="p-4 text-center" style="background-color: #6699CC !important;">
              <div class="g-ytsubscribe" data-channelid="UC3PTLY-FHMlIcyPibz0vQ0w" data-layout="full" data-theme="dark"
                data-count="default"></div>
              <div style="width:100%; margin-top:15px; border: none;">
                <iframe id="iframeYouTube" width="100%" height="350"
                  src="https://www.youtube.com/embed/ZTnpmzK96i8?sub_confirmation=1" frameborder="0"
                  style="border: none; border-radius: 10px;" allowfullscreen>
                </iframe>
              </div>
            </div>

          </div>
        </div>
